
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #ffffff;
            padding: 24px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top-section h2 {
            margin: 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 22px;
        }

        .item-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .category {
            color: #6b7280;
            font-size: 14px;
        }

        .item-info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .info-label {
            color: #6b7280;
            font-size: 12px;
        }

        .info-value {
            font-weight: 600;
            margin-top: 5px;
        }

        .expiration {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .form-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            display: none;
        }

        .form-card h3 {
            margin-top: 0;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            align-items: end;
            gap: 10px;
        }

        .secondary {
            background: #e5e7eb;
            color: #1f2937;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .status {
            margin-bottom: 20px;
            color: #6b7280;
        }

        .empty {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            main {
                margin-top: 25px;
            }

            .top-section {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SmartStock</h1>
    <p>Your household food inventory</p>
</header>

<main>

    <div class="top-section">
        <div>
            <h2>Inventory</h2>
            <p class="category">Manage your pantry and refrigerator</p>
        </div>

        <button onclick="showForm()">+ Add Item</button>
    </div>

    <div id="form-card" class="form-card">
        <h3>Add Inventory Item</h3>

        <form id="inventory-form">

            <div>
                <label for="product_name">Product Name</label>
                <input id="product_name" required>
            </div>

            <div>
                <label for="category">Category</label>
                <input id="category">
            </div>

            <div>
                <label for="quantity">Quantity</label>
                <input id="quantity" type="number" step="any" value="1" required>
            </div>

            <div>
                <label for="unit">Unit</label>
                <input id="unit" placeholder="e.g. carton, loaf">
            </div>

            <div>
                <label for="barcode">Barcode</label>
                <input id="barcode">
            </div>

            <div>
                <label for="purchase_date">Purchase Date</label>
                <input id="purchase_date" type="date">
            </div>

            <div>
                <label for="expiration_date">Expiration Date</label>
                <input id="expiration_date" type="date">
            </div>

            <div class="form-actions">
                <button type="submit">Save Item</button>
                <button type="button" class="secondary" onclick="hideForm()">Cancel</button>
            </div>

        </form>
    </div>

    <div id="status" class="status">Loading inventory...</div>

    <div id="inventory" class="inventory-grid"></div>

</main>

<script>

    const API_URL = "http://127.0.0.1:8000";

    async function loadInventory() {

        const inventoryContainer = document.getElementById("inventory");
        const status = document.getElementById("status");

        try {

            const response = await fetch(`${API_URL}/inventory`);

            if (!response.ok) {
                throw new Error("Failed to retrieve inventory");
            }

            const items = await response.json();

            inventoryContainer.innerHTML = "";

            status.textContent = `${items.length} inventory items`;

            if (items.length === 0) {

                inventoryContainer.innerHTML = `
                    <div class="empty">
                        Your inventory is empty.
                    </div>
                `;

                return;
            }

            items.forEach(item => {

                const card = document.createElement("div");
                card.className = "item-card";

                card.innerHTML = `
                    <h3>${escapeHTML(item.product_name)}</h3>

                    <div class="category">
                        ${escapeHTML(item.category || "Uncategorized")}
                    </div>

                    <div class="item-info">
                        <div>
                            <div class="info-label">Quantity</div>
                            <div class="info-value">
                                ${item.quantity} ${escapeHTML(item.unit || "")}
                            </div>
                        </div>
                    </div>

                    <div class="expiration">
                        <div class="info-label">Expiration Date</div>
                        <div class="info-value">
                            ${escapeHTML(item.expiration_date || "Not specified")}
                        </div>
                    </div>
                `;

                inventoryContainer.appendChild(card);

            });

        } catch (error) {

            status.textContent = "Unable to connect to SmartStock API.";

            inventoryContainer.innerHTML = `
                <div class="empty">
                    Could not load inventory. Make sure the backend is running.
                </div>
            `;

            console.error(error);
        }
    }


    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[character]));
    }


    function showForm() {
        document.getElementById("form-card").style.display = "block";
    }


    function hideForm() {
        document.getElementById("form-card").style.display = "none";
    }


    document.getElementById("inventory-form").addEventListener("submit", async function(event) {

        event.preventDefault();

        const item = {
            product_name: document.getElementById("product_name").value,
            barcode: document.getElementById("barcode").value || null,
            category: document.getElementById("category").value || null,
            quantity: parseFloat(document.getElementById("quantity").value),
            unit: document.getElementById("unit").value || null,
            purchase_date: document.getElementById("purchase_date").value || null,
            expiration_date: document.getElementById("expiration_date").value || null,
            date_confirmed: document.getElementById("expiration_date").value ? 1 : 0
        };

        try {

            const response = await fetch(`${API_URL}/inventory`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(item)
            });

            if (!response.ok) {
                throw new Error("Failed to add inventory item");
            }

            await response.json();

            this.reset();

            document.getElementById("quantity").value = 1;

            hideForm();

            await loadInventory();

        } catch (error) {

            alert("Unable to save item. Make sure the backend is running.");

            console.error(error);
        }
    });


    loadInventory();

</script>

</body>
</html>
